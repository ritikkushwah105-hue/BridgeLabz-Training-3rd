<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h2>GLA University Map</h2>

    <!-- loading="lazy" loads the map only when needed, improving page speed. -->
    <iframe
        title="GLA University Map"
        width="100%"
        height="400"
        loading="lazy"
        src="https://maps.google.com/maps?q=GLA%20University%20Mathura&t=&z=13&ie=UTF8&iwloc=&output=embed">
    </iframe>

</body>
</html>
