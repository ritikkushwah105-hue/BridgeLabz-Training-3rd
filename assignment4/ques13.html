<!DOCTYPE html>
<html>
<head>
    <title>Table with Iframe</title>
</head>
<body>

<h2>My Favourite Website</h2>

<table border="1">
    <tr>
        <th>Website</th>
        <th>Preview</th>
    </tr>
    <tr>
        <td>Wikipedia</td>
        <td>
            <iframe src="https://en.wikipedia.org/wiki/Main_Page"
                    width="400" height="200">
            </iframe>
        </td>
    </tr>
</table>

</body>
</html>
