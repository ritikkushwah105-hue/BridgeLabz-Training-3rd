<!DOCTYPE html>
<html>
<head>
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>CSS Card Flip</h1>

<div class="container">
    <div class="card">

        <div class="front">
            <h2>Front Side</h2>
            <p>Hover Me</p>
        </div>

        <div class="back">
            <h2>Back Side</h2>
            <p>Welcome to CSS 3D Flip Animation!</p>
        </div>

    </div>
</div>

</body>
</html>
