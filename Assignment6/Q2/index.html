<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Our Products</h1>

<div class="products">

    <div class="card">
        <img src="https://via.placeholder.com/200" alt="Shoes">
        <h2>Shoes</h2>
        <p>Comfortable sports shoes for daily use.</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200" alt="Watch">
        <h2>Watch</h2>
        <p>Stylish smartwatch with health tracking features.</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200" alt="Headphones">
        <h2>Headphones</h2>
        <p>Wireless headphones with amazing sound quality.</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
