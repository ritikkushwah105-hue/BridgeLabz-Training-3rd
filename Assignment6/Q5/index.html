<!DOCTYPE html>
<html>
<head>
    <title>Pricing Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Choose Your Plan</h1>

<div class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <h3>₹299/month</h3>
        <p>✔ HTML & CSS</p>
        <p>✔ 5 Projects</p>
        <button>Buy Now</button>
    </div>

    <div class="card popular">
        <h2>Standard</h2>
        <h3>₹599/month</h3>
        <p>✔ HTML, CSS & JS</p>
        <p>✔ 15 Projects</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <h3>₹999/month</h3>
        <p>✔ Full Web Development</p>
        <p>✔ Unlimited Projects</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
